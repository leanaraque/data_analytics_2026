<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="640" fill="#ffffff"/>
  <text x="24" y="34" fill="#1f3b57" font-size="20" font-weight="700">Modelo relacional — RetailPro (3NF)</text>
  <text x="24" y="56" fill="#6b7683" font-size="12">PK = clave primaria · FK = clave foránea · relaciones 1:N (crow's foot en el lado N)</text>

  <!-- ===== territorios (dim, arriba izq) ===== -->
  <g>
    <rect x="40" y="90" width="230" height="132" rx="6" fill="#eef3f8" stroke="#2d5075" stroke-width="1.5"/>
    <rect x="40" y="90" width="230" height="26" rx="6" fill="#2d5075"/>
    <text x="52" y="108" fill="#ffffff" font-size="13" font-weight="700">territorios</text>
    <text x="52" y="134" fill="#1f3b57" font-size="11.5" font-weight="700">PK  id_territorio</text><text x="200" y="134" fill="#6b7683" font-size="10.5">INT</text>
    <text x="52" y="154" fill="#3a4552" font-size="11.5">region</text><text x="175" y="154" fill="#6b7683" font-size="10.5">VARCHAR(50)</text>
    <text x="52" y="174" fill="#3a4552" font-size="11.5">pais</text><text x="175" y="174" fill="#6b7683" font-size="10.5">VARCHAR(50)</text>
    <text x="52" y="194" fill="#3a4552" font-size="11.5">zona</text><text x="175" y="194" fill="#6b7683" font-size="10.5">VARCHAR(50)</text>
  </g>

  <!-- ===== clientes (dim, arriba der) ===== -->
  <g>
    <rect x="650" y="90" width="240" height="172" rx="6" fill="#eef3f8" stroke="#2d5075" stroke-width="1.5"/>
    <rect x="650" y="90" width="240" height="26" rx="6" fill="#2d5075"/>
    <text x="662" y="108" fill="#ffffff" font-size="13" font-weight="700">clientes</text>
    <text x="662" y="134" fill="#1f3b57" font-size="11.5" font-weight="700">PK  id_cliente</text><text x="810" y="134" fill="#6b7683" font-size="10.5">INT</text>
    <text x="662" y="154" fill="#3a4552" font-size="11.5">nombre</text><text x="785" y="154" fill="#6b7683" font-size="10.5">VARCHAR(100)</text>
    <text x="662" y="174" fill="#3a4552" font-size="11.5">email</text><text x="785" y="174" fill="#6b7683" font-size="10.5">VARCHAR(120)</text>
    <text x="662" y="194" fill="#3a4552" font-size="11.5">ciudad</text><text x="785" y="194" fill="#6b7683" font-size="10.5">VARCHAR(80)</text>
    <text x="662" y="214" fill="#3a4552" font-size="11.5">segmento</text><text x="785" y="214" fill="#6b7683" font-size="10.5">VARCHAR(20)</text>
    <text x="662" y="234" fill="#3a4552" font-size="11.5">fecha_registro</text><text x="810" y="234" fill="#6b7683" font-size="10.5">DATE</text>
  </g>

  <!-- ===== productos (dim, abajo der) ===== -->
  <g>
    <rect x="650" y="410" width="240" height="172" rx="6" fill="#eef3f8" stroke="#2d5075" stroke-width="1.5"/>
    <rect x="650" y="410" width="240" height="26" rx="6" fill="#2d5075"/>
    <text x="662" y="428" fill="#ffffff" font-size="13" font-weight="700">productos</text>
    <text x="662" y="454" fill="#1f3b57" font-size="11.5" font-weight="700">PK  id_producto</text><text x="820" y="454" fill="#6b7683" font-size="10.5">INT</text>
    <text x="662" y="474" fill="#3a4552" font-size="11.5">nombre_producto</text><text x="828" y="474" fill="#6b7683" font-size="10.5">VARCHAR(120)</text>
    <text x="662" y="494" fill="#3a4552" font-size="11.5">categoria</text><text x="800" y="494" fill="#6b7683" font-size="10.5">VARCHAR(50)</text>
    <text x="662" y="514" fill="#3a4552" font-size="11.5">subcategoria</text><text x="800" y="514" fill="#6b7683" font-size="10.5">VARCHAR(50)</text>
    <text x="662" y="534" fill="#3a4552" font-size="11.5">precio</text><text x="800" y="534" fill="#6b7683" font-size="10.5">NUMERIC(12,2)</text>
    <text x="662" y="554" fill="#3a4552" font-size="11.5">costo</text><text x="800" y="554" fill="#6b7683" font-size="10.5">NUMERIC(12,2)</text>
  </g>

  <!-- ===== ventas (fact, centro) ===== -->
  <g>
    <rect x="335" y="250" width="250" height="212" rx="6" fill="#fff6e6" stroke="#c47f17" stroke-width="2"/>
    <rect x="335" y="250" width="250" height="26" rx="6" fill="#c47f17"/>
    <text x="347" y="268" fill="#ffffff" font-size="13" font-weight="700">ventas  (tabla de hechos)</text>
    <text x="347" y="294" fill="#1f3b57" font-size="11.5" font-weight="700">PK  id_venta</text><text x="505" y="294" fill="#6b7683" font-size="10.5">INT</text>
    <text x="347" y="314" fill="#3a4552" font-size="11.5">fecha_venta</text><text x="505" y="314" fill="#6b7683" font-size="10.5">DATE</text>
    <text x="347" y="334" fill="#b5561a" font-size="11.5" font-weight="700">FK  id_cliente</text><text x="505" y="334" fill="#6b7683" font-size="10.5">INT</text>
    <text x="347" y="354" fill="#b5561a" font-size="11.5" font-weight="700">FK  id_producto</text><text x="505" y="354" fill="#6b7683" font-size="10.5">INT</text>
    <text x="347" y="374" fill="#b5561a" font-size="11.5" font-weight="700">FK  id_territorio</text><text x="505" y="374" fill="#6b7683" font-size="10.5">INT</text>
    <text x="347" y="394" fill="#3a4552" font-size="11.5">cantidad</text><text x="505" y="394" fill="#6b7683" font-size="10.5">INT</text>
    <text x="347" y="414" fill="#3a4552" font-size="11.5">total_venta</text><text x="490" y="414" fill="#6b7683" font-size="10.5">NUMERIC(12,2)</text>
    <text x="347" y="434" fill="#3a4552" font-size="11.5">canal</text><text x="505" y="434" fill="#6b7683" font-size="10.5">VARCHAR(20)</text>
  </g>

  <!-- ===== Relaciones 1:N ===== -->
  <!-- territorios (1) -> ventas (N) -->
  <path d="M 270 165 L 335 330" fill="none" stroke="#2d5075" stroke-width="1.5"/>
  <text x="284" y="240" fill="#2d5075" font-size="12" font-weight="700">1</text>
  <text x="318" y="322" fill="#c47f17" font-size="12" font-weight="700">N</text>

  <!-- clientes (1) -> ventas (N) -->
  <path d="M 650 190 L 585 330" fill="none" stroke="#2d5075" stroke-width="1.5"/>
  <text x="628" y="212" fill="#2d5075" font-size="12" font-weight="700">1</text>
  <text x="592" y="322" fill="#c47f17" font-size="12" font-weight="700">N</text>

  <!-- productos (1) -> ventas (N) -->
  <path d="M 650 470 L 585 372" fill="none" stroke="#2d5075" stroke-width="1.5"/>
  <text x="628" y="466" fill="#2d5075" font-size="12" font-weight="700">1</text>
  <text x="592" y="384" fill="#c47f17" font-size="12" font-weight="700">N</text>

  <!-- Leyenda -->
  <rect x="40" y="470" width="230" height="120" rx="6" fill="#f7f8fa" stroke="#c9ced6"/>
  <text x="52" y="492" fill="#1f3b57" font-size="12" font-weight="700">Esquema en estrella</text>
  <text x="52" y="514" fill="#3a4552" font-size="11">· 1 tabla de hechos: ventas</text>
  <text x="52" y="532" fill="#3a4552" font-size="11">· 3 dimensiones: clientes,</text>
  <text x="62" y="548" fill="#3a4552" font-size="11">productos, territorios</text>
  <text x="52" y="570" fill="#3a4552" font-size="11">· 3 relaciones 1:N (una por FK)</text>
</svg>
